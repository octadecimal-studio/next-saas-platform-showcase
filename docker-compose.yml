services:
  octadecimal-saas:
    image: ghcr.io/octadecimalhq/octadecimal-saas:latest
    container_name: octadecimal-saas
    restart: unless-stopped
    ports:
      - "1341:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.octadecimal.cloud}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://admin.octadecimal.cloud}
      LARAVEL_API_URL: ${LARAVEL_API_URL}
      LARAVEL_API_TOKEN: ${LARAVEL_API_TOKEN}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      NEXT_PUBLIC_DEFAULT_LOCALE: pl
    networks:
      - octadecimal_cloud_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/pl"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "app=octadecimal-saas"
      - "team=frontend"

networks:
  octadecimal_cloud_network:
    external: true
    name: octadecimal_cloud_network
